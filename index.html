<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر شمس المستقبل</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; text-align: center; }
        .header { background: #2c3e50; color: white; padding: 20px; border-radius: 10px; margin-bottom: 30px; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .card { background: white; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; padding: 15px; transition: 0.3s; }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; height: 250px; object-fit: cover; border-radius: 10px; }
        .price { color: #e74c3c; font-size: 1.2em; font-weight: bold; display: block; margin: 10px 0; }
        .btn-whatsapp { background-color: #25D366; color: white; text-decoration: none; padding: 10px 20px; border-radius: 5px; display: block; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>شمس المستقبل (SUN THE FUTUER)</h1>
        <p>أحدث أجهزة الراوتر والـ UPS وملحقات الشبكات</p>
    </div>

    <div class="container">
        <div class="card">
            <img src="ضع_رابط_الصورة_هنا" alt="TP-Link AX55 PRO">
            <h3>TP-Link AX55-PRO</h3>
            <span class="price">السعر: راسلنا للتفاصيل</span>
            <a href="https://wa.me/9647733336103?text=اريد%20استفسار%20عن%20راوتر%20تبلنك%20AX55" class="btn-whatsapp">طلب عبر واتساب</a>
        </div>

        <div class="card">
            <img src="ضع_رابط_الصورة_هنا" alt="Huawei AX3">
            <h3>Huawei WiFi-6 AX3</h3>
            <span class="price">السعر: راسلنا للتفاصيل</span>
            <a href="https://wa.me/9647733336103?text=اريد%20استفسار%20عن%20راوتر%20هواوي%20AX3" class="btn-whatsapp">طلب عبر واتساب</a>
        </div>

        <div class="card">
            <img src="ضع_رابط_الصورة_هنا" alt="BlueStorm UPS">
            <h3>BlueStorm UPS-CAMERA</h3>
            <span class="price">10A - 17600mAh</span>
            <a href="https://wa.me/9647733336103?text=اريد%20طلب%20UPS%20بلوستورم" class="btn-whatsapp">طلب عبر واتساب</a>
        </div>
    </div>

</body>
</html>
